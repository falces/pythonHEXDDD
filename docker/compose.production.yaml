services:
  app:
    env_file: .env.prod
    build:
      dockerfile: ./docker/Dockerfile.prod
    ports:
      - ${HOST_HTTP_PORT}:${APPLICATION_HTTP_PORT}
    stdin_open: true
    tty: true
    entrypoint: /bin/sh /src/init.prod.sh
    depends_on:
      - db
    environment:
      FLASK_DEBUG: 0
      FLASK_ENV: production
      FLASK_APP: ./app.py
      PYTHONPYCACHEPREFIX: $HOME/.cache/cpython/
    networks:
      - shared_net
    restart: always
  db:
    image: mysql:9.1.0
    container_name: ${SERVICE_NAME}_db
    ports:
      - ${MYSQL_PUBLIC_PORT}:3306
    environment:
      MYSQL_ROOT_PASSWORD: ${MYSQL_ROOT_PASSWORD}
      MYSQL_DATABASE: ${MYSQL_DATABASE}
      MYSQL_USER: ${MYSQL_USER}
      MYSQL_PASSWORD: ${MYSQL_PASSWORD}
    healthcheck:
      test: ["CMD", "mysqladmin", "ping", "-h", "localhost", "-u", "root", "-p${MYSQL_ROOT_PASSWORD}"]
      timeout: 20s
      retries: 3
    networks:
      - shared_net
    restart: always
networks:
  shared_net:
    external: true
    name: common_network